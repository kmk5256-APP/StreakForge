name: iOS App Store QA
on:
  push:
    branches: [qa/app-store-release]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone 17 Pro Max, iPad Pro 13-inch (M5)]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select simulator
        id: simulator
        env:
          DEVICE_NAME: ${{ matrix.device }}
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,os,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in sorted(devices,reverse=True) for d in devices[runtime] if d["name"] == os.environ["DEVICE_NAME"]))')
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl status_bar "$device_id" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState unplugged --batteryLevel 100
      - name: Unit tests and app flows
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild test -project StreakForge.xcodeproj -scheme StreakForge -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/AppTests.xcresult" COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/tests.log"
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/TestAttachments"
          if [ -d "$RUNNER_TEMP/AppTests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/AppTests.xcresult" --output-path "$RUNNER_TEMP/TestAttachments"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/TestAttachments/
          retention-days: 7
